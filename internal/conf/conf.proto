syntax = "proto3";
package kratos.api;

option go_package = "github.com/clearlove456/paas/internal/conf;conf";

import "google/protobuf/duration.proto";

message Bootstrap {
  Server server = 1;
  Data data = 2;
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
}

message Data {
  message Database {
    string driver = 1;
    string source = 2;
  }
  message Redis {
    string network = 1;
    string addr = 2;
    google.protobuf.Duration read_timeout = 3;
    google.protobuf.Duration write_timeout = 4;
    string password = 5;
  }
  // canal binlog 订阅（缓存一致性兜底通道，经 RocketMQ 投递）
  message Rocketmq {
    bool enabled = 1;                    // 未部署 RocketMQ 前设为 false
    repeated string name_srv_addrs = 2;  // NameServer 地址
    string topic = 3;                    // canal 投递 binlog 的主题
    string group = 4;                    // 消费组
  }
  Database database = 1;
  Redis redis = 2;
  Rocketmq rocketmq = 3;
}

# 复制为 config.yaml 并填入真实连接信息（config.yaml 不入 git）
server:
  http:
    addr: 0.0.0.0:8000
    timeout: 300s # 发布接口同步等待就绪（最长 3min），不能太短
  grpc:
    addr: 0.0.0.0:9000
    timeout: 300s
data:
  database:
    driver: mysql
    source: user:password@tcp(host:3306)/paas?charset=utf8mb4&parseTime=True&loc=Local
  redis:
    addr: host:6379
    password: your-redis-password
    read_timeout: 0.2s
    write_timeout: 0.2s
  # consumers 的 key 是消费者全局标识，必须与 internal/data/consumer 注册表一致
  rocketmq:
    enabled: false
    name_srv_addrs: ["127.0.0.1:9876"]
    consumers:
      cache-evict-binlog:
        group: paas-cache-evictor
        topic: paas-canal
      cache-evict-delay:
        group: paas-cache-evict-delay
        topic: paas-cache-evict
kubernetes:
  enabled: false
  kubeconfig: /home/user/.kube/config # 空 = in-cluster（部署进集群时用）
